name: ContractrPro API CI

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - "api/**"
  push:
    branches: [ main, dev ]
    paths:
      - "api/**"

env:
  PORT: ${{ vars.PORT }}
  DB_DATABASE: ${{ vars.DB_DATABASE }}
  DB_HOST: ${{ vars.DB_HOST }}
  DB_PORT: ${{ vars.DB_PORT }}
  DB_USER: ${{ vars.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
  AWS_S3_REGION: ${{ vars.AWS_S3_REGION }}
  AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
  SECRET_SESSION_KEY_1: ${{ secrets.SECRET_SESSION_KEY_1 }}
  SECRET_SESSION_KEY_2: ${{ secrets.SECRET_SESSION_KEY_2 }}
  DEV_USER_UUID: ${{ vars.DEV_USER_UUID }}
  DEV_USER_USERNAME: ${{ vars.DEV_USER_USERNAME }}

jobs:
  lint-and-format:
    if: github.triggering_actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: "Dev Env"
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./api/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm prettier

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply formatting changes
          branch: ${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    environment: "Dev Env"
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./api/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build-and-deploy:
    needs: [ test ]
    runs-on: ubuntu-latest
    environment: "Dev Env"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./api/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push API to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/contractrpro-api:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/contractrpro-api:dev

  deploy-dev:
    needs: [ build-and-deploy ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: "Dev Env"
    steps:
      - name: Invoke Portainer deploy webhook
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK_URL }}